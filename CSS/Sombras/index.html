<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito de Sombra nos Elementos</title>
    <style>
        div{
            width: 200px;
            height: 200px;
            border: 10px solid #8f382e;
            margin: 20px auto;
            background: #fa8072;
            box-shadow: 2px 2px 2px red;
        }
        h1{
            text-shadow: 5px 5px 6px black;
        }
    </style>
</head>
<body>
    <h1>Propriedade <code>box-shadow</code></h1>
    <div></div>

    <h1>TESTANDO O TEXT-SHADOW</h1>
</body>
</html>
